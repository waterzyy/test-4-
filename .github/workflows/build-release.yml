name: Build and publish NucleusCoop

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: nucleuscoop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout (including recursive submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up NuGet
        uses: nuget/setup-nuget@v2

      - name: Install Visual C++ ATL headers required by ProtoInput
        id: atl-headers
        shell: pwsh
        run: |
          $vswhere = Join-Path "${env:ProgramFiles(x86)}" 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsInstallPath = (& $vswhere -latest -products '*' -property installationPath | Select-Object -First 1).Trim()
          if (-not $vsInstallPath) { throw 'Could not locate the Visual Studio installation.' }
          $vsInstaller = Join-Path (Split-Path $vswhere) 'vs_installer.exe'
          & $vsInstaller modify --installPath $vsInstallPath --add Microsoft.VisualStudio.Component.VC.ATL --add Microsoft.VisualStudio.Component.VC.14.29.16.11.ATL --quiet --wait --norestart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $atlHeader = Get-ChildItem (Join-Path $vsInstallPath 'VC/Tools/MSVC') -Filter atlbase.h -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $atlHeader) {
            Write-Host '::error::Visual Studio ATL components completed without making atlbase.h available.'
            exit 1
          }
          $atlInclude = $atlHeader.DirectoryName
          Write-Host "Using ATL headers from $atlInclude"
          Write-Host "::notice title=ATL include directory::$atlInclude"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "atl_include=$atlInclude"
          $protoRoot = 'Submodules/ProtoInput'
          foreach ($nativeProject in Get-ChildItem $protoRoot -Filter *.vcxproj -Recurse) {
            [xml]$nativeXml = [System.IO.File]::ReadAllText($nativeProject.FullName)
            $nativeNamespaces = New-Object System.Xml.XmlNamespaceManager($nativeXml.NameTable)
            $nativeNamespaces.AddNamespace('msb', 'http://schemas.microsoft.com/developer/msbuild/2003')
            foreach ($compiler in $nativeXml.SelectNodes('//msb:ItemDefinitionGroup/msb:ClCompile', $nativeNamespaces)) {
              $directories = $compiler.SelectSingleNode('msb:AdditionalIncludeDirectories', $nativeNamespaces)
              if (-not $directories) {
                $directories = $nativeXml.CreateElement('AdditionalIncludeDirectories', 'http://schemas.microsoft.com/developer/msbuild/2003')
                $compiler.AppendChild($directories) | Out-Null
              }
              $directories.InnerText = "$atlInclude;$($directories.InnerText)"
            }
            $nativeXml.Save($nativeProject.FullName)
            $patchedText = [System.IO.File]::ReadAllText($nativeProject.FullName)
            $includePrefix = "<AdditionalIncludeDirectories>$atlInclude;"
            if (-not $patchedText.Contains($includePrefix)) {
              $patchedText = $patchedText.Replace('<AdditionalIncludeDirectories>', $includePrefix)
              [System.IO.File]::WriteAllText($nativeProject.FullName, $patchedText)
            }
            if ($nativeProject.Name -eq 'EasyHookDll.vcxproj' -and -not $patchedText.Contains($includePrefix)) {
              throw "ATL include path was not added to $($nativeProject.FullName)."
            }
          }
          foreach ($managedProject in @(
            'Submodules/ProtoInput/lib/EasyHook/EasyHook/EasyHook.csproj',
            'Submodules/ProtoInput/lib/EasyHook/EasyHookSvc/EasyHookSvc.csproj'
          )) {
            [xml]$managedXml = [System.IO.File]::ReadAllText((Resolve-Path $managedProject))
            $managedNamespaces = New-Object System.Xml.XmlNamespaceManager($managedXml.NameTable)
            $managedNamespaces.AddNamespace('msb', 'http://schemas.microsoft.com/developer/msbuild/2003')
            $defaultConfiguration = $managedXml.SelectNodes('//msb:Configuration', $managedNamespaces) | Where-Object { $_.Condition -like "*== ''*" } | Select-Object -First 1
            if ($defaultConfiguration) { $defaultConfiguration.InnerText = 'netfx4-Release' }
            $managedXml.Save((Resolve-Path $managedProject))
          }

      - name: Install .NET Framework 4.0 reference assemblies
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:RUNNER_TEMP 'netfx-reference-assemblies'
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net40 -Version 1.0.3 -OutputDirectory $packageDir -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $frameworkRoot = (Resolve-Path (Join-Path $packageDir 'Microsoft.NETFramework.ReferenceAssemblies.net40.1.0.3/build')).Path
          if (-not (Test-Path (Join-Path $frameworkRoot '.NETFramework/v4.0/mscorlib.dll'))) {
            throw "The .NET Framework 4.0 reference assemblies were not found beneath $frameworkRoot."
          }
          Add-Content -Path $env:GITHUB_ENV -Value "TargetFrameworkRootPath=$frameworkRoot"

      - name: Restore solution packages
        shell: pwsh
        run: |
          nuget restore Master/NucleusCoop.sln
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nuget restore Submodules/ProtoInput/src/ProtoInput/ProtoInput.sln
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Nucleus native hooks (x86 and x64)
        shell: pwsh
        run: |
          $solutionDir = (Resolve-Path 'Master').Path + '\'
          foreach ($platform in @('Win32', 'x64')) {
            foreach ($project in @('Nucleus.Hook', 'Nucleus.SHook')) {
              $projectFile = "Master/$project/$project.vcxproj"
              Write-Host "Building $project for $platform"
              & msbuild $projectFile /m /p:Configuration=Release "/p:Platform=$platform" "/p:SolutionDir=$solutionDir" /p:WindowsTargetPlatformVersion=10.0 /verbosity:minimal
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }

      - name: Build ProtoInput native dependencies (x86 and x64)
        id: protoinput-build
        env:
          ATL_INCLUDE: ${{ steps.atl-headers.outputs.atl_include }}
        shell: pwsh
        run: |
          try {
            if (-not $env:ATL_INCLUDE) { throw 'ATL_INCLUDE was not set by the Visual C++ setup step.' }
            Write-Host "Preparing ProtoInput; ATL headers: $env:ATL_INCLUDE"
            $env:CL = "/I`"$env:ATL_INCLUDE`""
            $env:INCLUDE = "$env:ATL_INCLUDE;$env:INCLUDE"
            $protoRoot = 'Submodules/ProtoInput'
            $easyHook = Join-Path $protoRoot 'lib/EasyHook'
            $msbuildNamespace = 'http://schemas.microsoft.com/developer/msbuild/2003'

            # EasyHook's native project references two legacy C# projects that are not
            # members of ProtoInput.sln. Pin those references to their actual Release
            # configurations; let MSBuild build them as part of the dependency graph.
            foreach ($projectFile in @(
              (Join-Path $easyHook 'EasyHookDll/EasyHookDll.vcxproj'),
              (Join-Path $easyHook 'EasyHookSvc/EasyHookSvc.csproj')
            )) {
              Write-Host "Preparing EasyHook project references in $projectFile"
              [xml]$projectXml = [System.IO.File]::ReadAllText((Resolve-Path $projectFile))
              $namespaces = New-Object System.Xml.XmlNamespaceManager($projectXml.NameTable)
              $namespaces.AddNamespace('msb', $msbuildNamespace)
              foreach ($reference in $projectXml.SelectNodes('//msb:ProjectReference', $namespaces)) {
                $configuration = $reference.SelectSingleNode('msb:SetConfiguration', $namespaces)
                if (-not $configuration) {
                  $configuration = $projectXml.CreateElement('SetConfiguration', $msbuildNamespace)
                  $reference.AppendChild($configuration) | Out-Null
                }
                $configuration.InnerText = 'Configuration=netfx4-Release'
                $platform = $reference.SelectSingleNode('msb:SetPlatform', $namespaces)
                if (-not $platform) {
                  $platform = $projectXml.CreateElement('SetPlatform', $msbuildNamespace)
                  $reference.AppendChild($platform) | Out-Null
                }
                $platform.InnerText = 'Platform=AnyCPU'
              }
              $projectXml.Save((Resolve-Path $projectFile))
            }

            $solution = Join-Path $protoRoot 'src/ProtoInput/ProtoInput.sln'
            foreach ($platform in @('x86', 'x64')) {
              $log = Join-Path $env:RUNNER_TEMP "protoinput-$platform-msbuild.log"
              $binaryLog = Join-Path $env:RUNNER_TEMP "protoinput-$platform.binlog"
              Write-Host "Building ProtoInput solution for $platform with its MSBuild dependency graph."
              & msbuild $solution /m /p:Configuration=Release "/p:Platform=$platform" /p:BuildProjectReferences=true /p:WindowsTargetPlatformVersion=10.0 "/bl:$binaryLog" /verbosity:minimal 2>&1 | Tee-Object -FilePath $log
              $buildExitCode = $LASTEXITCODE
              if ($buildExitCode -ne 0) {
                $diagnostics = Get-Content $log | Where-Object { $_ -match 'error|fatal|MSB[0-9]{4}' }
                if (-not $diagnostics) { $diagnostics = Get-Content $log | Select-Object -Last 60 }
                foreach ($line in $diagnostics) {
                  $safeLine = $line.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                  Write-Host "::error::$safeLine"
                }
                Write-Host "ProtoInput binary diagnostic log: $binaryLog"
                exit $buildExitCode
              }
            }
          } catch {
            $message = $_.Exception.ToString()
            $location = $_.InvocationInfo.PositionMessage
            $details = "$message`n$location".Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=ProtoInput build-step exception::$details"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value @(
              '### ProtoInput build-step exception',
              '',
              '```text',
              $message,
              $location,
              '```',
              ''
            )
            throw
          }

      - name: Surface ProtoInput build logs
        if: failure()
        shell: pwsh
        run: |
          $logs = @(Get-ChildItem $env:RUNNER_TEMP -Filter 'protoinput-*.log' -File -ErrorAction SilentlyContinue)
          if ($logs.Count -eq 0) {
            Write-Host '::error::ProtoInput build failed before producing an MSBuild text log.'
            exit 0
          }
          foreach ($log in $logs) {
            $lines = @(Get-Content $log.FullName)
            Write-Host "::group::ProtoInput MSBuild output: $($log.Name)"
            $tail = @($lines | Select-Object -Last 100)
            $details = ($tail -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=ProtoInput MSBuild tail::$details"
            Write-Host '::endgroup::'
            $summary = @("### $($log.Name)", '', '```text') + $tail + @('```', '')
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ($summary -join [Environment]::NewLine)
          }

      - name: Upload ProtoInput diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: protoinput-msbuild-diagnostics
          path: |
            ${{ runner.temp }}/protoinput-*.log
            ${{ runner.temp }}/protoinput-*.binlog
          if-no-files-found: warn
          retention-days: 7

      - name: Build managed solution
        shell: pwsh
        run: |
          msbuild Master/NucleusCoop.sln /m /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0 /p:RestorePackages=false /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble distribution archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $PWD 'dist/NucleusCoop'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $mainOutput = 'Master/NucleusCoopTool/bin/Release'
          if (-not (Test-Path "$mainOutput/NucleusCoop.exe")) {
            throw "Expected app output was not produced: $mainOutput/NucleusCoop.exe"
          }
          Copy-Item "$mainOutput/*" $dist -Recurse -Force

          # Include per-project outputs and native binaries not copied by the app's post-build step.
          $extraOutputDirs = @(
            'Master/NucleusGaming/bin/Release/bin',
            'Master/StartGame/bin/Release',
            'Master/Nucleus.Inject/bin/x64/Release',
            'Master/x64/Release',
            'Master/Win32/Release',
            'Submodules/ProtoInput/src/ProtoInput/Release/x64'
          )
          foreach ($dir in $extraOutputDirs) {
            if (Test-Path $dir) {
              $leaf = Split-Path $dir -Leaf
              $target = Join-Path $dist "_build-output/$leaf"
              New-Item -ItemType Directory -Force -Path $target | Out-Null
              Copy-Item "$dir/*" $target -Recurse -Force
            }
          }

          # Ensure the runtime utilities/resources folder is present in the packaged app.
          if (-not (Test-Path (Join-Path $dist 'utils'))) {
            $utilsSource = 'Master/NucleusCoopTool/copyoutput/utils'
            if (Test-Path $utilsSource) { Copy-Item $utilsSource $dist -Recurse -Force }
          }
          if (-not (Test-Path (Join-Path $dist 'utils'))) {
            throw 'The distribution is missing the required utils directory.'
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path $dist -DestinationPath dist/NucleusCoop-SelfBuilt.zip -CompressionLevel Optimal -Force
          if (-not (Test-Path 'dist/NucleusCoop-SelfBuilt.zip')) { throw 'Archive creation failed.' }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-custom-${{ github.sha }}
          target_commitish: ${{ github.sha }}
          name: NucleusCoop self-built ${{ github.sha }}
          body: Automated Windows Release build for commit ${{ github.sha }}.
          token: ${{ github.token }}
          files: dist/NucleusCoop-SelfBuilt.zip
          fail_on_unmatched_files: true
